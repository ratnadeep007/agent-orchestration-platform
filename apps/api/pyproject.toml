[project]
name = "agent-platform-api"
version = "0.1.0"
description = "FastAPI service for the agent orchestration platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "redis>=5.2.1",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
